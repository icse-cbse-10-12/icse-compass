name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run full dependency audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate --json > npm-audit.json
          audit_status=$?
          set -e
          echo "$audit_status" > npm-audit-exit-code
          echo "npm audit exit code: $audit_status"
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-evidence
          path: |
            package-lock.json
            npm-audit.json
            npm-audit-exit-code
          if-no-files-found: error
          retention-days: 7
      - name: Svelte and TypeScript checks
        run: npm run check
      - name: Run Vitest
        run: npm test
      - name: Build static site and PWA
        run: npm run build
      - name: Verify prerendered Pages and PWA output
        run: |
          test -s build/index.html
          test -s build/materials/index.html
          test -s build/creators/index.html
          test -s build/school-papers/index.html
          test -s build/privacy/index.html
          test -s build/404.html
          test -s build/manifest.webmanifest
          test -s build/sw.js
          test -s build/robots.txt
          test -s build/sitemap.xml
          test -s build/llms.txt
          test -f build/.nojekyll
          grep -Fq 'ICSE Compass is not affiliated with, endorsed by, or an official product of CISCE.' build/index.html
          grep -Fq 'Your study space should stay yours.' build/privacy/index.html
          grep -Fq 'https://icse-cbse-10-12.github.io/icse-compass/privacy/' build/sitemap.xml
          grep -Fq 'https://icse-cbse-10-12.github.io/icse-compass/privacy/' build/llms.txt
          if grep -RniE 'fonts\.googleapis\.com|fonts\.gstatic\.com|hotjar|clarity\.ms|googletagmanager\.com|google-analytics\.com|doubleclick\.net|connect\.facebook\.net|segment\.io|fullstory\.com' src static; then echo 'External font or tracking endpoint found in first-party source.'; exit 1; fi
          node --input-type=module -e "import fs from 'node:fs'; const m = JSON.parse(fs.readFileSync('build/manifest.webmanifest', 'utf8')); const expected = { name: 'ICSE Compass', short_name: 'ICSE Compass', theme_color: '#356B58', background_color: '#F5F1E8', display: 'standalone', scope: '/icse-compass/', start_url: '/icse-compass/' }; for (const [key, value] of Object.entries(expected)) { if (m[key] !== value) throw new Error('Invalid manifest ' + key + ': ' + m[key]); }"
      - name: Enforce dependency audit
        run: test "$(cat npm-audit-exit-code)" = "0"
