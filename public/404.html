<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>ICSE Compass</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var base = "/icse-compass/";
        if (path.startsWith(base) && path !== base) {
          sessionStorage.setItem("icse-compass-redirect", path + window.location.search + window.location.hash);
          window.location.replace(base);
        }
      })();
    </script>
  </head>
  <body>
    <p>Returning to ICSE Compass…</p>
  </body>
</html>
